name: HOLOS Python, media, and Godot checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-and-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Run Python and FFmpeg integration tests
        run: python -m unittest discover -s tests -v
      - name: Inventory checked-out source tree
        run: python tools/holos.py inventory
      - name: Audit Godot resource dependencies
        run: python tools/holos.py audit-godot-assets --godot-project godot

  godot-offscreen-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install virtual display and software renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgl1-mesa-dri
      - name: Download pinned Godot 4.4.1
        run: |
          curl --fail --location --retry 10 --retry-all-errors --retry-delay 2 --retry-max-time 180 \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot.zip"
          echo "d6e382fb531019f85630c1f485a561a0d20c4a2344b6c3847735cfee7da812aa  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.4.1-stable_linux.x86_64"

      - name: Validate Godot project import and script parsing
        env:
          HOLOS_GODOT: ${{ runner.temp }}/godot-bin/Godot_v4.4.1-stable_linux.x86_64
        run: |
          "$HOLOS_GODOT" --headless --editor --path godot --quit
          test -d godot/.godot

      - name: Run headless HOLOS timeline self-test
        env:
          HOLOS_GODOT: ${{ runner.temp }}/godot-bin/Godot_v4.4.1-stable_linux.x86_64
        run: |
          "$HOLOS_GODOT" --headless --path godot --script res://test_scenes/timeline_selftest.gd

      - name: Run real Godot offscreen render integration test
        env:
          HOLOS_GODOT: ${{ runner.temp }}/godot-bin/Godot_v4.4.1-stable_linux.x86_64
          HOLOS_GODOT_HEADLESS: "0"
          HOLOS_GODOT_DISPLAY_WRAPPER: xvfb-run
        run: LIBGL_ALWAYS_SOFTWARE=1 python -m unittest discover -s tests -p "test_godot_integration.py" -v
