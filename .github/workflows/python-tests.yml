name: HOLOS Python, media, and Godot checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-and-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Run Python and FFmpeg integration tests
        run: python -m unittest discover -s tests -v

  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install virtual display and software renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgl1-mesa-dri
      - name: Download pinned Godot 4.4.1
        run: |
          curl --fail --location --retry 3 \
            https://downloads.godotengine.org/?version=4.4.1&flavor=stable&slug=linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot.zip"
          unzip "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.4.1-stable_linux.x86_64"
      - name: Run real headless Godot render integration test
        env:
          HOLOS_GODOT: ${{ runner.temp }}/godot-bin/Godot_v4.4.1-stable_linux.x86_64
          HOLOS_GODOT_HEADLESS: "0"
          HOLOS_GODOT_DISPLAY_WRAPPER: xvfb-run
        run: LIBGL_ALWAYS_SOFTWARE=1 python -m unittest discover -s tests -p "test_godot_integration.py" -v
