name: HOLOS Python and media checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Run standard-library and media integration tests
        run: python -m unittest discover -s tests -v
